name: Threek
options:
  bundleIdPrefix: com.lpfchan
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Threek
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "JV4AQ2NAC3"
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Threek:
    type: application
    platform: macOS

    sources:
      - path: App
      - path: NowPlaying
      - path: Popup
      - path: MediaKeys
      - path: Preferences
      - path: Resources
      # The perl shim and the built adapter framework/test client are staged
      # into Build/Adapter by the pre-build script below and copied verbatim.
      - path: Build/Adapter

    resources:
      - path: Resources/Assets.xcassets

    preBuildScripts:
      - name: Build MediaRemote Adapter
        script: |
          "$SRCROOT/scripts/build-adapter.sh"
        basedOnDependencyAnalysis: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lpfchan.Threek
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Threek.entitlements

    info:
      path: Info.plist
      properties:
        CFBundleName: Threek
        CFBundleIdentifier: com.lpfchan.Threek
        CFBundleVersion: "1"
        CFBundleShortVersionString: "2.0.0"
        CFBundleIconName: AppIcon
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 LPFchan. All rights reserved."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAccessibilityUsageDescription: "Threek needs Accessibility access to intercept media keys and let you choose which app receives them."
        NSAppleEventsUsageDescription: "Threek needs to send play/pause to the media apps you choose."

    entitlements:
      path: Threek.entitlements

    dependencies:
      - sdk: CoreAudio.framework

    scheme:
      buildAction:
        parallelizeBuild: true
